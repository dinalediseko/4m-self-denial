<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon – Unlocking Me</title>
    <link rel="icon" href="images/4m logo.png" type="image" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&family=Shrikhand&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #f9ffe3;
            --green: #014421;
            --light-green: #e1eba7;
            --accent: #bcd64d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--green);
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            color: var(--bg);
            text-align: center;
        }

        .card {
            background: var(--bg);
            color: var(--green);
            max-width: 500px;
            width: 100%;
            padding: 50px 30px;
            border-radius: 30px;
            box-shadow: 12px 12px 0 var(--accent);
            border: 4px solid var(--green);
        }

        .logo {
            width: 90px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Shrikhand', cursive;
            font-size: 3rem;
            line-height: 1.1;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .btn-back {
            display: inline-block;
            background: var(--green);
            color: var(--bg);
            font-family: 'Shrikhand', cursive;
            font-size: 1.3rem;
            padding: 15px 35px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 5px 5px 0 var(--accent);
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn-back:hover {
            transform: translate(-3px, -3px);
            box-shadow: 8px 8px 0 var(--accent);
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 4M logo replaces the key -->
        <img src="images/4m logo.png" alt="4M Logo" class="logo" />

        <h1>Coming<br>Soon</h1>
        <p>This session isn’t live just yet.<br>Check back later.</p>
        <a href="index.html" class="btn-back">← Back to Program</a>
    </div>
</body>
</html>
